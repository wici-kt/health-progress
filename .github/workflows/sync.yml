name: Sync Notion logbook

on:
  schedule:
    # 14:00 UTC is 22:00 in Hong Kong
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pull the logbook from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node tools/sync-notion.mjs
      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain data/logbook.json)" ]; then
            echo "No change to data/logbook.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/logbook.json
          git commit -m "Sync Notion logbook"
          git push
