<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 · Sign in</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/styles.css?v=3">
<style>
  .login { max-width: 380px; margin: 12vh auto 0; }
  .login h1 { font-size: 1.5rem; margin-bottom: 0.4rem; }
  .login p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .login input {
    width: 100%; padding: 0.7rem 0.75rem; font: inherit; font-size: 1rem;
    border: 1px solid var(--hair); border-radius: var(--radius); background: var(--surface); color: var(--ink);
  }
  .login button {
    width: 100%; margin-top: 0.9rem; padding: 0.8rem; font: inherit; font-size: 1rem; font-weight: 600;
    background: var(--accent); color: #fff; border: 0; border-radius: var(--radius); cursor: pointer;
  }
  .login button:disabled { opacity: 0.6; }
  .login .status { margin-top: 0.9rem; font-size: 0.88rem; min-height: 1.2rem; }
  .login .status.err { color: var(--danger); }
</style>
</head>
<body>
<main class="login" style="padding: 0 1.25rem">
  <h1>健康進度</h1>
  <p>呢個網站有你嘅體重、睡眠同心率數據，需要密碼才可以查看。</p>
  <form id="login">
    <label class="visually-hidden" for="password">密碼</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="密碼 Password" autofocus>
    <button type="submit" id="submit">登入 Sign in</button>
    <p class="status" id="status"></p>
  </form>
</main>
<script>
(function () {
  var form = document.getElementById("login");
  var status = document.getElementById("status");
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var button = document.getElementById("submit");
    button.disabled = true;
    status.className = "status";
    status.textContent = "登入中…";
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value })
    })
      .then(function (response) { return response.json().catch(function () { return { ok: false, error: "HTTP " + response.status }; }); })
      .then(function (result) {
        if (!result.ok) throw new Error(result.error || "登入失敗");
        var next = new URLSearchParams(location.search).get("next") || "/";
        location.replace(next);
      })
      .catch(function (error) {
        status.className = "status err";
        status.textContent = error.message === "Wrong password" ? "密碼唔正確" : ("登入失敗：" + error.message);
        button.disabled = false;
        document.getElementById("password").select();
      });
  });
})();
</script>
</body>
</html>
